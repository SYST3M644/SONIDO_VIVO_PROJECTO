<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Amplificador de bajo">
  <rect width="400" height="300" fill="#faf7f2"/>
  <defs>
    <pattern id="rejilla-b" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#6b6375"/>
    </pattern>
  </defs>
  <!-- Mueble mas profundo -->
  <rect x="86" y="54" width="228" height="196" rx="10" fill="#2e2b33"/>
  <!-- Panel superior -->
  <rect x="100" y="64" width="200" height="28" rx="4" fill="#1c1a1f"/>
  <g fill="#e0a23b">
    <circle cx="120" cy="78" r="7"/><circle cx="146" cy="78" r="7"/>
    <circle cx="172" cy="78" r="7"/><circle cx="198" cy="78" r="7"/>
  </g>
  <rect x="222" y="72" width="64" height="12" rx="3" fill="#b4541e"/>
  <!-- Rejilla perforada -->
  <rect x="100" y="102" width="200" height="134" rx="5" fill="#1c1a1f"/>
  <rect x="100" y="102" width="200" height="134" rx="5" fill="url(#rejilla-b)"/>
  <!-- Parlante de 8 pulgadas -->
  <circle cx="200" cy="169" r="52" fill="#1c1a1f" opacity="0.6"/>
  <circle cx="200" cy="169" r="16" fill="#e0a23b" opacity="0.75"/>
  <!-- Asa lateral -->
  <rect x="178" y="44" width="44" height="9" rx="4" fill="#4a4751"/>
  <!-- Patas de goma -->
  <g fill="#1c1a1f">
    <rect x="106" y="250" width="24" height="10" rx="3"/>
    <rect x="270" y="250" width="24" height="10" rx="3"/>
  </g>
</svg>
