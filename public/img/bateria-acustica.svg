<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Bateria acustica">
  <rect width="400" height="300" fill="#faf7f2"/>
  <!-- Soportes -->
  <g stroke="#9b96a3" stroke-width="3">
    <line x1="62" y1="96" x2="62" y2="212"/>
    <line x1="338" y1="94" x2="338" y2="212"/>
    <line x1="40" y1="212" x2="84" y2="212"/>
    <line x1="316" y1="212" x2="360" y2="212"/>
  </g>
  <!-- Platillos -->
  <g fill="#e0a23b">
    <ellipse cx="62" cy="92" rx="40" ry="9"/>
    <ellipse cx="338" cy="90" rx="36" ry="8"/>
  </g>
  <!-- Toms aereos -->
  <g>
    <circle cx="146" cy="116" r="37" fill="#b4541e"/>
    <circle cx="146" cy="116" r="30" fill="#f2e7d5"/>
    <circle cx="254" cy="114" r="33" fill="#b4541e"/>
    <circle cx="254" cy="114" r="26" fill="#f2e7d5"/>
  </g>
  <!-- Bombo -->
  <circle cx="200" cy="208" r="70" fill="#b4541e"/>
  <circle cx="200" cy="208" r="58" fill="#f2e7d5"/>
  <circle cx="200" cy="208" r="18" fill="#1c1a1f"/>
  <!-- Tensores del bombo -->
  <g fill="#1c1a1f">
    <rect x="195" y="134" width="10" height="12" rx="2"/>
    <rect x="195" y="270" width="10" height="12" rx="2"/>
    <rect x="128" y="203" width="12" height="10" rx="2"/>
    <rect x="260" y="203" width="12" height="10" rx="2"/>
  </g>
  <!-- Pedal -->
  <rect x="186" y="284" width="28" height="8" rx="3" fill="#2e2b33"/>
</svg>
