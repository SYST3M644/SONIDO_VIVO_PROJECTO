<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Microfono dinamico">
  <rect width="400" height="300" fill="#faf7f2"/>
  <defs>
    <pattern id="malla-mic" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#6b6375"/>
    </pattern>
  </defs>
  <!-- Cable enrollado -->
  <path d="M200 240c0 22-34 24-34 8s34-14 34 12 30 26 48 14" stroke="#1c1a1f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cuerpo del microfono -->
  <path d="M182 108h36a6 6 0 0 1 6 6l-5 118a9 9 0 0 1-9 9h-20a9 9 0 0 1-9-9l-5-118a6 6 0 0 1 6-6z" fill="#2e2b33"/>
  <!-- Anillo de union -->
  <rect x="178" y="100" width="44" height="12" rx="5" fill="#1c1a1f"/>
  <!-- Canastillo -->
  <circle cx="200" cy="74" r="38" fill="#4a4751"/>
  <circle cx="200" cy="74" r="38" fill="url(#malla-mic)"/>
  <path d="M162 74a38 38 0 0 1 76 0z" fill="#6b6375" opacity="0.35"/>
  <!-- Aro decorativo -->
  <circle cx="200" cy="74" r="38" fill="none" stroke="#e0a23b" stroke-width="3"/>
  <!-- Interruptor -->
  <rect x="193" y="150" width="14" height="26" rx="4" fill="#e0a23b"/>
</svg>
